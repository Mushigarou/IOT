# Namespace holding the application deployed by Argo CD.
apiVersion: v1
kind: Namespace
metadata:
  name: dev

---
# Serve the Argo CD API/UI in plain HTTP so Traefik can proxy it without TLS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
data:
  server.insecure: "true"

---
# Publish the Argo CD UI on http://localhost:8080
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-ingress
  namespace: argocd
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: argocd-server
            port:
              number: 80

---
# Continuously sync the GitHub repository into the dev namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: will42
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Mushigarou/mfouadi-iot-app
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
