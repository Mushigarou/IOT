apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: will42
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Mushigarou/mfouadi-iot-app
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true # Delete resources not defined in Git
      selfHeal: true # Revert any manual changes to match Git state
    syncOptions:
      - CreateNamespace=true